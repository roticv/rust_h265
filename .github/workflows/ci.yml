name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt -- --check

  overflow-checks:
    # Release builds wrap on integer overflow, so the fuzz regression tests
    # (test_fuzz_*) only prove their fix when overflow panics, as it does in
    # a caller's debug build or under cargo-fuzz.
    name: Test with overflow checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --release
        env:
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'true'
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: 'true'

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88
      - name: Build and test
        run: cargo test --release

  miri:
    # The shared picture tables (src/shared.rs) are the crate's only unsafe
    # code: check them, and a small multithreaded decode, under Miri's
    # aliasing and data-race model.
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Unsafe module and thread pool tests
        run: 'cargo miri test --lib -- shared:: parallel::'
      - name: Small threaded decode
        run: cargo miri test --lib threaded_decode_small
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
