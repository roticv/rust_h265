[package]
name = "rust_h265"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Pure Rust H.265/HEVC video decoder: Main, Main 10 and the 4:2:0 / 4:4:4 range-extension profiles up to 12-bit, multithreaded"
license = "MIT OR Apache-2.0"
repository = "https://github.com/roticv/rust_h265"
readme = "README.md"
keywords = ["hevc", "h265", "video", "decoder", "codec"]
categories = ["multimedia::video"]
# Test fixtures and development tooling stay in the repository: the
# library needs none of them, and testdata is most of the package size.
exclude = ["testdata/", "tools/", ".github/", "CLAUDE.md"]

[dependencies]

[dev-dependencies]
sha2 = "0.10"
minifb = "0.28"

[[example]]
name = "bench_decode"
